<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情報Ⅰ 知識確認</title>
<style>
:root{--navy:#172846;--ink:#172033;--muted:#657187;--line:#d8e0ea;--paper:#f4f7fb;--accent:#207a66;--soft:#e8f5f1;--good:#187a5b;--bad:#b54747}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,select,input{font:inherit}button{touch-action:manipulation}.head{padding:26px clamp(18px,4vw,54px) 21px;background:var(--navy);color:#fff}.head small{font-size:11px;font-weight:800;letter-spacing:.14em;color:#8ed5c4}.head h1{margin:7px 0 5px;font-size:clamp(24px,3vw,36px)}.head p{margin:0;color:#cbd5e5;font-size:14px}.main{max-width:930px;margin:auto;padding:22px clamp(14px,4vw,44px) 50px}.panel{padding:clamp(18px,3vw,28px);border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 3px 14px #2639580d}.panel h2{margin:0 0 5px;font-size:21px}.lead{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.7}.field{margin:19px 0}.field>label,.legend{display:block;margin-bottom:9px;font-size:13px;font-weight:800}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{position:relative}.check input{position:absolute;opacity:0;pointer-events:none}.check span{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#46556d;font-size:13px;font-weight:700;cursor:pointer}.check input:checked+span{border-color:var(--accent);background:var(--soft);color:#176452}.selects{display:grid;grid-template-columns:1fr 1fr;gap:13px}.selects select{width:100%;padding:11px;border:1px solid #aebdce;border-radius:9px;background:#fff}.primary,.secondary{border:0;border-radius:9px;padding:11px 17px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#40506a}.primary:disabled{opacity:.45;cursor:not-allowed}.error{min-height:1.4em;margin:9px 0;color:var(--bad);font-size:12px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.progress{height:7px;flex:1;overflow:hidden;border-radius:99px;background:#e6ebf1}.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}.number{font-size:12px;font-weight:800;color:var(--muted)}.category{display:inline-block;margin-bottom:12px;padding:5px 8px;border-radius:999px;background:var(--soft);color:#176452;font-size:11px;font-weight:800}.question{margin:0 0 18px;font-size:clamp(19px,2.6vw,25px);line-height:1.55}.options{display:grid;gap:9px}.option{display:grid;grid-template-columns:32px 1fr;align-items:start;gap:10px;width:100%;padding:13px;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;line-height:1.55}.option:hover:not(:disabled){border-color:#86bba9;background:#f8fcfb}.option .letter{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#eef2f6;font-size:12px;font-weight:900}.option.selected{border-color:var(--accent);background:var(--soft)}.option.correct{border-color:var(--good);background:#eaf7f1}.option.wrong{border-color:var(--bad);background:#fff0f0}.feedback{margin-top:16px;padding:14px;border-left:4px solid var(--accent);background:#f5f8fb;border-radius:6px;line-height:1.7;font-size:13px}.feedback strong{display:block;margin-bottom:4px}.feedback a{color:#176452;font-weight:800}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.score{display:flex;align-items:baseline;gap:9px;margin:17px 0}.score strong{font-size:42px;color:var(--accent)}.score span{color:var(--muted)}.breakdown{display:grid;gap:8px;margin:18px 0}.row{display:grid;grid-template-columns:minmax(110px,1fr) 2fr 52px;align-items:center;gap:10px;font-size:13px}.bar{height:8px;border-radius:99px;background:#e6ebf1;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.mistakes{margin-top:20px}.mistake{padding:12px 0;border-top:1px solid #edf0f4}.mistake b{display:block}.mistake p{margin:5px 0;color:var(--muted);font-size:13px;line-height:1.6}.result-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}[hidden]{display:none!important}
.question{white-space:pre-line}
@media(max-width:620px){.head{padding-top:21px}.main{padding:12px 10px 36px}.panel{padding:17px 14px}.selects{grid-template-columns:1fr}.option{padding:12px 10px}.row{grid-template-columns:95px 1fr 44px}.nav .secondary{padding-inline:11px}}
</style>
</head>
<body>
<header class="head"><small>INFORMATION I / REVIEW</small><h1>知識確認</h1><p>範囲と出題数を指定して、理解度を確認</p></header>
<main class="main">
  <section class="panel" id="setup">
    <h2>出題設定</h2>
    <p class="lead">複数の分野を組み合わせられます。問題は選択した範囲から毎回ランダムに構成されます。</p>
    <div class="field"><span class="legend">出題範囲</span><div class="checks" id="categoryChecks"></div></div>
    <div class="selects">
      <div class="field"><label for="countSelect">問題数</label><select id="countSelect"><option value="5">5問</option><option value="10" selected>10問</option><option value="20">20問</option><option value="all">選択範囲の全問</option></select></div>
      <div class="field"><label for="modeSelect">出題形式</label><select id="modeSelect"><option value="mixed">用語・定義を混在</option><option value="term">用語から定義</option><option value="definition">定義から用語</option></select></div>
    </div>
    <div class="error" id="setupError" role="alert"></div>
    <button class="primary" id="startBtn">開始</button>
  </section>

  <section class="panel" id="questionPanel" hidden>
    <div class="topline"><div class="progress"><i id="progressBar"></i></div><div class="number" id="questionNumber"></div></div>
    <span class="category" id="questionCategory"></span>
    <h2 class="question" id="questionText"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" hidden></div>
    <div class="nav"><button class="secondary" id="quitBtn">出題設定へ</button><button class="primary" id="nextBtn" disabled>次の問題</button></div>
  </section>

  <section class="panel" id="resultPanel" hidden>
    <h2>結果</h2><div class="score"><strong id="score"></strong><span id="scoreSub"></span></div>
    <div class="breakdown" id="breakdown"></div>
    <div class="mistakes" id="mistakes"></div>
    <div class="result-actions"><button class="primary" id="retryWrong">誤答のみ再確認</button><button class="secondary" id="retrySame">同じ条件で再出題</button><button class="secondary" id="backSetup">出題設定へ</button></div>
  </section>
</main>
<script src="terms-data.js"></script>
<script>
const terms=window.INFO_TERMS.map((x,i)=>({id:i,category:x[0],term:x[1],definition:x[2],point:x[3]}));
const categories=[...new Set(terms.map(x=>x.category))],letters=['A','B','C','D'];
const setup=document.getElementById('setup'),questionPanel=document.getElementById('questionPanel'),resultPanel=document.getElementById('resultPanel');
let questions=[],index=0,answers=[],lastSettings=null,locked=false;
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('categoryChecks').innerHTML=categories.map((c,i)=>`<label class="check"><input type="checkbox" value="${esc(c)}" ${i<categories.length?'checked':''}><span>${esc(c)}</span></label>`).join('');
function settings(){return{categories:[...document.querySelectorAll('#categoryChecks input:checked')].map(x=>x.value),count:document.getElementById('countSelect').value,mode:document.getElementById('modeSelect').value}}
function createQuestions(s,sourceTerms){
  const pool=sourceTerms||terms.filter(t=>s.categories.includes(t.category));
  const amount=s.count==='all'?pool.length:Math.min(Number(s.count),pool.length);
  return shuffle(pool).slice(0,amount).map((t,i)=>{
    const mode=s.mode==='mixed'?(i%2?'definition':'term'):s.mode;
    let distractorPool=terms.filter(x=>x.id!==t.id&&x.category===t.category);
    if(distractorPool.length<3)distractorPool=terms.filter(x=>x.id!==t.id);
    const picks=shuffle(distractorPool).slice(0,3);
    const optionTerms=shuffle([t,...picks]);
    return{term:t,mode,prompt:mode==='term'? `「${t.term}」の説明として最も適切なものを選んでください。`: `次の説明に該当する用語を選んでください。\n${t.definition}`,options:optionTerms.map(x=>({id:x.id,label:mode==='term'?x.definition:x.term})),correctId:t.id};
  });
}
function start(s,sourceTerms){
  lastSettings=s;questions=createQuestions(s,sourceTerms);index=0;answers=[];locked=false;
  if(!questions.length){document.getElementById('setupError').textContent='出題範囲を1つ以上選択してください。';return}
  setup.hidden=true;resultPanel.hidden=true;questionPanel.hidden=false;renderQuestion();scrollTo({top:0,behavior:'smooth'});
}
function renderQuestion(){
  locked=false;const q=questions[index];
  document.getElementById('questionNumber').textContent=`${index+1} / ${questions.length}`;
  document.getElementById('progressBar').style.width=`${index/questions.length*100}%`;
  document.getElementById('questionCategory').textContent=q.term.category;
  document.getElementById('questionText').textContent=q.prompt;
  document.getElementById('options').innerHTML=q.options.map((o,i)=>`<button class="option" data-id="${o.id}"><span class="letter">${letters[i]}</span><span>${esc(o.label)}</span></button>`).join('');
  document.getElementById('feedback').hidden=true;document.getElementById('nextBtn').disabled=true;
  document.getElementById('nextBtn').textContent=index===questions.length-1?'結果を表示':'次の問題';
}
document.getElementById('options').addEventListener('click',e=>{
  const button=e.target.closest('.option');if(!button||locked)return;locked=true;
  const q=questions[index],selected=Number(button.dataset.id),correct=selected===q.correctId;
  answers.push({question:q,selected,correct});
  document.querySelectorAll('.option').forEach(b=>{b.disabled=true;const id=Number(b.dataset.id);if(id===q.correctId)b.classList.add('correct');else if(id===selected)b.classList.add('wrong')});
  const f=document.getElementById('feedback');f.hidden=false;f.innerHTML=`<strong>${correct?'正答です。':'正答：'+esc(q.mode==='term'?q.term.definition:q.term.term)}</strong>${esc(q.term.point)}<br><a href="glossary.html?q=${encodeURIComponent(q.term.term)}">用語集で確認</a>`;
  document.getElementById('nextBtn').disabled=false;
});
document.getElementById('nextBtn').addEventListener('click',()=>{if(index<questions.length-1){index++;renderQuestion();questionPanel.scrollIntoView({block:'start'})}else showResult()});
function showResult(){
  questionPanel.hidden=true;resultPanel.hidden=false;document.getElementById('progressBar').style.width='100%';
  const correct=answers.filter(x=>x.correct).length;document.getElementById('score').textContent=`${correct} / ${answers.length}`;document.getElementById('scoreSub').textContent=`正答率 ${Math.round(correct/answers.length*100)}%`;
  const groups=lastSettings.categories.map(c=>{const a=answers.filter(x=>x.question.term.category===c);return{c,total:a.length,ok:a.filter(x=>x.correct).length}}).filter(x=>x.total);
  document.getElementById('breakdown').innerHTML=groups.map(x=>`<div class="row"><b>${esc(x.c)}</b><div class="bar"><i style="width:${x.ok/x.total*100}%"></i></div><span>${x.ok}/${x.total}</span></div>`).join('');
  const wrong=answers.filter(x=>!x.correct);document.getElementById('mistakes').innerHTML=wrong.length?`<h3>再確認する項目</h3>`+wrong.map(x=>`<div class="mistake"><b>${esc(x.question.term.term)}</b><p>${esc(x.question.term.definition)}</p></div>`).join(''):'<p class="lead">誤答はありません。</p>';
  document.getElementById('retryWrong').hidden=!wrong.length;
  localStorage.setItem('info1_knowledge_check',JSON.stringify({date:new Date().toISOString(),total:answers.length,correct,categories:lastSettings.categories,wrongIds:wrong.map(x=>x.question.term.id)}));
  scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('startBtn').addEventListener('click',()=>{document.getElementById('setupError').textContent='';start(settings())});
document.getElementById('quitBtn').addEventListener('click',()=>{questionPanel.hidden=true;setup.hidden=false;scrollTo({top:0})});
document.getElementById('backSetup').addEventListener('click',()=>{resultPanel.hidden=true;setup.hidden=false;scrollTo({top:0})});
document.getElementById('retrySame').addEventListener('click',()=>start(lastSettings));
document.getElementById('retryWrong').addEventListener('click',()=>{const wrongTerms=answers.filter(x=>!x.correct).map(x=>x.question.term);start({...lastSettings,count:'all'},wrongTerms)});
</script>
</body>
</html>
