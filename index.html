<head>

<title>DNCL ステップ実行ラボ</title>
<style>
:root{--ink:#172033;--muted:#657089;--line:#dce3ee;--navy:#182b4d;--blue:#1769aa;--pale:#eaf7ff;--cyan:#d7f1ff;--green:#0a7b58;--amber:#9a5c00;--paper:#f5f7fb;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 24px;background:var(--navy);color:#fff}.top h1{margin:0 0 3px;font-size:22px}.top small{opacity:.85}.tabs{display:flex;gap:8px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);overflow:auto}.tab{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 14px;color:#46516a;font-weight:700;cursor:pointer}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.workspace{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 112px)}.left{padding:20px 16px;background:#fff;border-right:1px solid var(--line)}.kicker{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.08em}.left h2{margin:5px 0 7px;font-size:20px}.goal{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.65}.exercise-list{display:grid;gap:7px}.exercise{width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.exercise strong,.exercise span{display:block}.exercise span{margin-top:3px;color:var(--muted);font-size:11px}.exercise.active{border-color:#76b8e8;background:var(--pale)}.howto{margin-top:16px;padding:12px;border-radius:9px;background:#f3f6fa;color:#49556e;font-size:12px;line-height:1.7}.main{padding:18px}.taskbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}.taskbar h2{margin:0 0 5px;font-size:21px}.question{margin:0;color:#49556e}.badge{white-space:nowrap;padding:6px 10px;border-radius:999px;background:#e7eefb;color:#244879;font-size:12px;font-weight:800}.stage{display:grid;grid-template-columns:minmax(470px,1.35fr) minmax(330px,.85fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(33,48,77,.05)}.panel-head{display:flex;justify-content:space-between;padding:10px 14px;background:#edf1f6;color:#46516a;font-size:12px;font-weight:800}.edit-guide{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfdff}.edit-guide b{color:#116694}.dirty{display:none;color:var(--amber);font-size:12px;font-weight:700}.dirty.show{display:inline}.code{padding:12px;background:#101b2e;color:#e9f0fa;font:15px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:250px}.line{position:relative;padding:3px 8px 3px 42px;border-radius:5px;white-space:pre-wrap}.line:before{content:attr(data-n);position:absolute;left:8px;width:22px;text-align:right;color:#71809a}.line.done{color:#aebbd0}.line.now{background:#263d63;color:#fff}.line.now:after{content:'▶';position:absolute;left:2px;color:#55c7ff}.edit{min-width:48px;max-width:95px;padding:2px 6px;border:1px solid #65b9e8;border-radius:5px;background:var(--cyan);color:#10233f;font:inherit;text-align:center}.edit.array{width:180px;max-width:52%}select.edit{min-width:62px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid #263750;background:#16243b}.btn{border:0;border-radius:7px;padding:9px 12px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.btn.light{background:#fff;color:#243550}.btn.dark{background:#274a75;color:#fff}.btn.blue{background:#1684c5;color:#fff}.progress{flex:1;min-width:80px;height:7px;border-radius:9px;background:#465872;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#53c8ff}.counter{color:#dce7f6;font-size:12px}.hint{padding:12px 14px;background:#fff8e5;color:#76500d;font-size:13px}.side{display:grid;grid-template-rows:auto 1fr}.prediction{padding:14px;border-bottom:1px solid var(--line);background:#f9fcff}.prediction label{display:block;margin-bottom:7px;font-weight:800}.predict-row{display:flex;gap:7px}.predict-row input{min-width:0;flex:1;padding:9px;border:1px solid #aebbd0;border-radius:7px}.feedback{min-height:22px;margin-top:7px;font-size:12px;font-weight:700}.view-tabs{display:flex;gap:6px;padding:11px 12px 0}.view-tab{border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 10px;color:#536079;font-weight:800;cursor:pointer}.view-tab.active{background:#e9f4ff;border-color:#75b9e7;color:#155f91}.view{padding:12px}.view h3{margin:0 0 8px;font-size:14px}.array-card{margin-bottom:12px}.array-name{font:700 13px ui-monospace,monospace;margin-bottom:4px}.array-grid{display:flex;overflow:auto}.cell{min-width:48px;text-align:center}.cell .idx{padding:2px;color:#7b879e;font:11px ui-monospace,monospace}.cell .val{padding:7px;border:1px solid var(--line);border-right:0;background:#fff;font:700 14px ui-monospace,monospace}.cell:last-child .val{border-right:1px solid var(--line)}.cell.focus .val{background:#bdeaff;border-color:#4aaee2;box-shadow:inset 0 0 0 1px #4aaee2}.focus-note{margin-top:5px;color:#126b9e;font:700 12px ui-monospace,monospace}.vars{width:100%;border-collapse:collapse;margin-bottom:12px}.vars th,.vars td{padding:7px 8px;border-bottom:1px solid #edf0f5;text-align:left;font:13px ui-monospace,monospace}.vars th{width:42%;color:#58657d}.changed{display:inline-block;padding:2px 6px;border-radius:5px;background:#fff2a8;color:#594400}.log{padding:10px;border-left:4px solid #61b6e6;background:#eef8ff;color:#244663;font-size:13px;line-height:1.55}.screen{min-height:48px;padding:10px;border-radius:7px;background:#101b2e;color:#fff;white-space:pre-wrap;font:14px/1.55 ui-monospace,monospace}.trace-wrap{overflow:auto;max-height:430px}.trace{width:100%;border-collapse:collapse;font-size:12px}.trace th,.trace td{padding:7px;border:1px solid var(--line);text-align:left;vertical-align:top}.trace th{position:sticky;top:0;background:#edf2f8}.trace td:first-child{text-align:center}.note{padding:8px 14px;border-top:1px solid var(--line);color:#7a8497;font-size:11px;background:#fbfcfe}
@media(max-width:940px){.workspace{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}.exercise-list{grid-template-columns:repeat(3,1fr)}.howto{display:none}.stage{grid-template-columns:1fr}.code{min-height:210px}.side{min-height:380px}}
@media(max-width:600px){.top{padding:12px 14px}.top>small{display:none}.main{padding:10px}.left{padding:14px 10px}.exercise-list{grid-template-columns:1fr}.taskbar{display:block}.badge{display:inline-block;margin-top:8px}.edit.array{width:140px}.controls .progress{order:9;flex-basis:70%}}
</style>
</head>
<body>
<header class="top"><div><h1>DNCL ステップ実行ラボ</h1><small>紙で予想し、1行ずつ確かめ、最後は紙へ戻す。</small></div><small>情報Ⅰ 共通テスト対策</small></header>
<nav class="tabs" id="tabs"></nav>
<main class="workspace">
<aside class="left"><div class="kicker" id="round"></div><h2 id="lessonTitle"></h2><p class="goal" id="goal"></p><div class="exercise-list" id="exerciseList"></div><div class="howto"><b>使い方</b><br>①プリントで最後の出力を予想<br>②水色部分を必要に応じて変更<br>③「1行実行」で値を確認<br>④トレース表をプリントへ写す<br><span style="color:#9a5c00">変更値は次の実行時に自動反映されます。</span></div></aside>
<section class="main"><div class="taskbar"><div><h2 id="taskTitle"></h2><p class="question" id="question"></p></div><span class="badge" id="concept"></span></div>
<div class="stage"><section class="panel"><div class="panel-head"><span>プログラム本体</span><span>▶ は次に実行する行</span></div><div class="edit-guide"><span><b>水色の部分だけ変更できます</b>　<span class="dirty" id="dirty">● 変更あり</span></span><button class="btn light" id="restore">元の設定に戻す</button></div><div class="code" id="code"></div><div class="controls"><button class="btn light" id="reset">↺ 最初から</button><button class="btn light" id="back">← 1行戻る</button><button class="btn dark" id="next">1行実行 →</button><button class="btn blue" id="auto">自動実行</button><div class="progress"><i id="bar"></i></div><span class="counter" id="counter"></span></div><div class="hint" id="hint"></div><div class="note">表記は動きを学ぶための「共通テスト風」です。実行中の説明は右側に分けて表示します。</div></section>
<section class="panel side"><div class="prediction"><label for="prediction">最後の出力を予想しよう</label><div class="predict-row"><input id="prediction" autocomplete="off" placeholder="例：14"><button class="btn blue" id="check">予想を記録</button></div><div class="feedback" id="feedback"></div></div><div><div class="view-tabs"><button class="view-tab active" data-view="current">現在値</button><button class="view-tab" data-view="trace">トレース表</button></div><div class="view" id="currentView"><div id="arrays"></div><h3>変数の現在値</h3><table class="vars"><tbody id="vars"></tbody></table><h3>実行ログ</h3><div class="log" id="log">まだ実行していません。</div><h3 style="margin-top:12px">表示された内容</h3><div class="screen" id="outputScreen">（まだ何も表示されていません）</div></div><div class="view" id="traceView" hidden><div class="trace-wrap"><table class="trace"><thead><tr><th>回</th><th>行</th><th>実行したこと</th><th>実行後の値</th></tr></thead><tbody id="traceBody"></tbody></table></div></div></div></section></div></section></main>
<script>
const E=(key,value,type=typeof value==='number'?'number':'text',options=[])=>({key,value,type,options});
const lessons=[
 {title:'代入・分岐・反復',goal:'まずは、値が一行ごとにどう変わるかをつかむ。',items:[
  {title:'値の上書き',concept:'代入',question:'数値を変えると、最後の x はどう変わる？',hint:'右辺を先に計算し、その結果を左辺へ入れる。',fields:[E('start',3),E('add',5),E('mul',2),E('sub',4)],build:buildChain},
  {title:'3段階の判定',concept:'条件分岐',question:'点数や境界値を変えて、判定の順序を確かめよう。',hint:'上から調べ、最初に成立した処理だけを行う。',fields:[E('score',78),E('high',80),E('low',60)],build:buildBranch},
  {title:'1からnの合計',concept:'繰り返し',question:'終点 n を変え、合計の増え方を追おう。',hint:'同じ行を繰り返し通り、i と goukei が変化する。',fields:[E('n',5)],build:buildSum}
 ]},
 {title:'配列を順に追う',goal:'添字と配列の要素を結び付けて読む。',items:[
  {title:'配列の参照',concept:'配列',question:'更新する位置と値を変えると、配列はどうなる？',hint:'添字は0から始まる。強調された要素に注目する。',fields:[E('data','4, 7, 3, 6','array'),E('index',2),E('value',10)],build:buildArrayRef},
  {title:'配列の合計',concept:'配列＋反復',question:'配列を変え、goukei の変化を追おう。',hint:'i は添字。加える数は Data[i]。',fields:[E('data','4, 7, 3, 6','array')],build:buildArraySum},
  {title:'条件つき集計',concept:'配列＋分岐',question:'基準値や比較記号を変えると、個数はどう変わる？',hint:'条件が偽の回は、kosu が変わらない。',fields:[E('data','4, 7, 8, 3, 6','array'),E('op','>=','select',['>=','>','<=','<','==']),E('cut',5)],build:buildCount}
 ]},
 {title:'探索と待ち時間',goal:'候補や時刻が更新される瞬間を見つける。',items:[
  {title:'最大・最小を探す',concept:'探索',question:'比較記号を変えて、最大値探索と最小値探索を切り替えよう。',hint:'候補は配列の最初の要素から始める。',fields:[E('data','5, 2, 8, 7, 9','array'),E('op','>','select',['>','<'])],build:s=>buildExtreme(s,false)},
  {title:'開始位置を変える',concept:'探索の初期値',question:'最初の候補に使う添字を変えるとどうなる？',hint:'初期値と、調べ始める位置の関係に注目する。',fields:[E('data','5, 2, 8, 7, 9','array'),E('start',0),E('op','>','select',['>','<'])],build:s=>buildExtreme(s,true)},
  {title:'待ち時間の更新',concept:'時刻の更新',question:'到着時刻・処理時間を変えて、受付可能時刻を追おう。',hint:'開始時刻は「到着」と「受付可能」の大きい方。',fields:[E('arrival','2, 5, 11','array'),E('duration','4, 3, 3','array')],build:buildWait}
 ]},
 {title:'長い処理を役割で分ける',goal:'二重ループ・担当者探索・更新を別々の役割として読む。' ,items:[
  {title:'■の長方形',concept:'二重ループ',question:'行数・列数を変え、内側の処理回数を確かめよう。',hint:'外側が行、内側が列。内側が終わると改行する。',fields:[E('rows',3),E('cols',5)],build:buildRectangle},
  {title:'組合せを数える',concept:'二重ループ',question:'人数 n を変えると、i < j の組は何組？',hint:'i を固定して、j だけを動かして数える。',fields:[E('n',4)],build:buildPairs},
  {title:'担当者を割り当てる',concept:'二重ループ＋更新',question:'すべて割り当てた後の配列 Akibi を予想しよう。',hint:'外側は工芸品、内側は担当者探索。更新後のAkibiを次の回へ引き継ぐ。',fields:[E('akibi','6, 3, 3, 5','array'),E('nissu','4, 2','array'),E('op','<','select',['<','<='])],build:buildAssign}
 ]}
];
function clamp(v,a,b){v=parseInt(v,10);return Number.isFinite(v)?Math.max(a,Math.min(b,v)):a}
function arrayOf(v){const a=String(v).split(/[、,\s]+/).filter(Boolean).map(Number).filter(Number.isFinite);return (a.length?a:[0]).slice(0,12)}
function compare(a,op,b){return ({'>':a>b,'<':a<b,'>=':a>=b,'<=':a<=b,'==':a==b})[op]}
function copyVars(v){const o={};for(const [k,x] of Object.entries(v||{}))o[k]=Array.isArray(x)?[...x]:x;return o}
function frame(line,vars,log,out,focus){return{line,vars:copyVars(vars),log,out,focus}}
function buildChain(s){let x=+s.start,fs=[];fs.push(frame(0,{x},`x に ${x} を代入`));x+=+s.add;fs.push(frame(1,{x},`x に ${x} を代入`));x*=+s.mul;fs.push(frame(2,{x},`x に ${x} を代入`));x-=+s.sub;fs.push(frame(3,{x},`x に ${x} を代入`));fs.push(frame(4,{x},`x の値 ${x} を表示`,String(x)));return{code:['x = {{start}}','x = x + {{add}}','x = x * {{mul}}','x = x - {{sub}}','表示する(x)'],frames:fs}}
function buildBranch(s){const score=+s.score,high=+s.high,low=+s.low,v={tokuten:score},fs=[frame(0,v,`tokuten に ${score} を代入`)];const a=score>=high;fs.push(frame(1,v,`${score} >= ${high} は ${a?'真':'偽'}`));if(a)fs.push(frame(2,v,'最初の条件が真なので A を表示','A'));else{const b=score>=low;fs.push(frame(3,v,`${score} >= ${low} は ${b?'真':'偽'}`));if(b)fs.push(frame(4,v,'2番目の条件が真なので B を表示','B'));else{fs.push(frame(5,v,'どちらの条件も偽なので「そうでなければ」へ進む'));fs.push(frame(6,v,'C を表示','C'))}}return{code:['tokuten = {{score}}','もし tokuten >= {{high}} ならば:','｜ 表示する("A")','そうでなくもし tokuten >= {{low}} ならば:','｜ 表示する("B")','そうでなければ:','└ 表示する("C")'],frames:fs}}
function buildSum(s){const n=clamp(s.n,1,12),v={goukei:0},fs=[frame(0,v,'goukei を 0 で初期化')];for(let i=1;i<=n;i++){v.i=i;fs.push(frame(1,v,`${i} 回目の繰り返しを開始`));v.goukei+=i;fs.push(frame(2,v,`goukei に ${i} を加えて ${v.goukei}`))}fs.push(frame(3,v,`goukei の値 ${v.goukei} を表示`,String(v.goukei)));return{code:['goukei = 0','i を 1 から {{n}} まで 1 ずつ増やしながら繰り返す:','｜ goukei = goukei + i','表示する(goukei)'],frames:fs}}
function buildArrayRef(s){const a=arrayOf(s.data),i=clamp(s.index,0,a.length-1),fs=[frame(0,{Data:a},'配列 Data を用意')];a[i]=+s.value;fs.push(frame(1,{Data:a,i},`Data[${i}] を ${+s.value} に変更`,undefined,{name:'Data',index:i}));fs.push(frame(2,{Data:a,i},'配列 Data 全体を表示',`[${a.join(', ')}]`,{name:'Data',index:i}));return{code:['Data = [{{data}}]','Data[{{index}}] = {{value}}','表示する(Data)'],frames:fs}}
function buildArraySum(s){const a=arrayOf(s.data),v={Data:a,goukei:0},fs=[frame(0,v,'配列 Data を用意'),frame(1,v,'goukei を 0 で初期化')];for(let i=0;i<a.length;i++){v.i=i;fs.push(frame(2,v,`添字 i=${i} の要素を調べる`,undefined,{name:'Data',index:i}));v.goukei+=a[i];fs.push(frame(3,v,`Data[${i}]=${a[i]} を加えて ${v.goukei}`,undefined,{name:'Data',index:i}))}fs.push(frame(4,v,`goukei の値 ${v.goukei} を表示`,String(v.goukei)));return{code:['Data = [{{data}}]','goukei = 0','i を 0 から Dataの要素数-1 まで繰り返す:','｜ goukei = goukei + Data[i]','表示する(goukei)'],frames:fs}}
function buildCount(s){const a=arrayOf(s.data),cut=+s.cut,v={Data:a,kosu:0},fs=[frame(0,v,'配列 Data を用意'),frame(1,v,'kosu を 0 で初期化')];for(let i=0;i<a.length;i++){v.i=i;fs.push(frame(2,v,`添字 i=${i} の要素を調べる`,undefined,{name:'Data',index:i}));const ok=compare(a[i],s.op,cut);fs.push(frame(3,v,`Data[${i}]=${a[i]} ${s.op} ${cut} は ${ok?'真':'偽'}`,undefined,{name:'Data',index:i}));if(ok){v.kosu++;fs.push(frame(4,v,`kosu を 1 増やして ${v.kosu}`,undefined,{name:'Data',index:i}))}}fs.push(frame(5,v,`kosu の値 ${v.kosu} を表示`,String(v.kosu)));return{code:['Data = [{{data}}]','kosu = 0','i を 0 から Dataの要素数-1 まで繰り返す:','｜ もし Data[i] {{op}} {{cut}} ならば:','｜ └ kosu = kosu + 1','表示する(kosu)'],frames:fs}}
function buildExtreme(s,choose){const a=arrayOf(s.data),p=choose?clamp(s.start,0,a.length-1):0,v={Data:a,koushin:a[p]},fs=[frame(0,{Data:a},'配列 Data を用意'),frame(1,v,`Data[${p}]=${a[p]} を最初の候補にする`,undefined,{name:'Data',index:p})];for(let i=p+1;i<a.length;i++){v.i=i;fs.push(frame(2,v,`次の候補 Data[${i}] を調べる`,undefined,{name:'Data',index:i}));const ok=compare(a[i],s.op,v.koushin);fs.push(frame(3,v,`${a[i]} ${s.op} ${v.koushin} は ${ok?'真':'偽'}`,undefined,{name:'Data',index:i}));if(ok){v.koushin=a[i];fs.push(frame(4,v,`候補を ${a[i]} に更新`,undefined,{name:'Data',index:i}))}}fs.push(frame(5,v,`koushin の値 ${v.koushin} を表示`,String(v.koushin)));return{code:['Data = [{{data}}]',`koushin = Data[${choose?'{{start}}':'0'}]`,`i を ${choose?'{{start}}+1':'1'} から Dataの要素数-1 まで繰り返す:`,'｜ もし Data[i] {{op}} koushin ならば:','｜ └ koushin = Data[i]','表示する(koushin)'],frames:fs}}
function buildWait(s){const a=arrayOf(s.arrival),d=arrayOf(s.duration),n=Math.min(a.length,d.length),v={touchaku:a,jikan:d,uketuke:0},fs=[frame(0,{touchaku:a},'到着時刻の配列を用意'),frame(1,{touchaku:a,jikan:d},'処理時間の配列を用意'),frame(2,v,'uketuke を 0 で初期化')];for(let i=0;i<n;i++){v.i=i;fs.push(frame(3,v,`人 ${i} の処理を始める`,undefined,{name:'touchaku',index:i}));v.kaishi=Math.max(a[i],v.uketuke);fs.push(frame(4,v,`max(${a[i]}, ${v.uketuke}) = ${v.kaishi}`,undefined,{name:'touchaku',index:i}));v.uketuke=v.kaishi+d[i];fs.push(frame(5,v,`${v.kaishi}+${d[i]}=${v.uketuke} に更新`,undefined,{name:'jikan',index:i}))}fs.push(frame(6,v,`uketuke の値 ${v.uketuke} を表示`,String(v.uketuke)));return{code:['touchaku = [{{arrival}}]','jikan = [{{duration}}]','uketuke = 0','i を 0 から 人数-1 まで繰り返す:','｜ kaishi = max(touchaku[i], uketuke)','｜ uketuke = kaishi + jikan[i]','表示する(uketuke)'],frames:fs}}
function buildRectangle(s){const rows=clamp(s.rows,1,8),cols=clamp(s.cols,1,12),v={gyou:0,retu:0,kosu:0},fs=[];let out='';for(let g=1;g<=rows;g++){v.gyou=g;fs.push(frame(0,v,`外側 ${g} 行目を開始`,out));for(let r=1;r<=cols;r++){v.retu=r;fs.push(frame(1,v,`内側 ${r} 列目`,out));v.kosu++;out+='■';fs.push(frame(2,v,'■ を横に1個表示',out))}if(g<rows)out+='\n';fs.push(frame(3,v,'1行分が終わったので改行',out))}return{code:['gyou を 1 から {{rows}} まで繰り返す:','｜ retu を 1 から {{cols}} まで繰り返す:','｜ ｜ "■" を横に表示','｜ 改行する'],frames:fs}}
function buildPairs(s){const n=clamp(s.n,2,10),v={kosu:0},fs=[frame(0,v,'kosu を 0 で初期化')];for(let i=0;i<n-1;i++){v.i=i;fs.push(frame(1,v,`外側 i=${i} を開始`));for(let j=i+1;j<n;j++){v.j=j;fs.push(frame(2,v,`組 (${i}, ${j}) を調べる`));v.kosu++;fs.push(frame(3,v,`kosu を 1 増やして ${v.kosu}`))}}fs.push(frame(4,v,`kosu の値 ${v.kosu} を表示`,String(v.kosu)));return{code:['kosu = 0','i を 0 から {{n}}-2 まで繰り返す:','｜ j を i+1 から {{n}}-1 まで繰り返す:','｜ └ kosu = kosu + 1','表示する(kosu)'],frames:fs}}
function buildAssign(s){const a=arrayOf(s.akibi),d=arrayOf(s.nissu),v={Akibi:a,Nissu:d},fs=[frame(0,v,'配列 Akibi と Nissu を用意')];for(let k=0;k<d.length;k++){v.k=k;fs.push(frame(1,v,`外側 k=${k}：工芸品の日数 ${d[k]} を割り当てる`,undefined,{name:'Nissu',index:k}));v.saishou=a[0];v.tantou=0;fs.push(frame(2,v,`Akibi[0]=${a[0]} を最初の候補にする`,undefined,{name:'Akibi',index:0}));for(let i=1;i<a.length;i++){v.i=i;fs.push(frame(3,v,`担当者 i=${i} の Akibi[${i}]=${a[i]} を調べる`,undefined,{name:'Akibi',index:i}));const ok=compare(a[i],s.op,v.saishou);fs.push(frame(4,v,`${a[i]} ${s.op} ${v.saishou} は ${ok?'真':'偽'}`,undefined,{name:'Akibi',index:i}));if(ok){v.saishou=a[i];v.tantou=i;fs.push(frame(5,v,`候補を担当者 ${i} に更新`,undefined,{name:'Akibi',index:i}))}}a[v.tantou]+=d[k];v.Akibi=a;fs.push(frame(6,v,`担当者 ${v.tantou} の空き日に ${d[k]} を加える`,`[${a.join(', ')}]`,{name:'Akibi',index:v.tantou}))}return{code:['Akibi = [{{akibi}}], Nissu = [{{nissu}}]','k を 0 から Nissuの要素数-1 まで繰り返す:','｜ saishou = Akibi[0], tantou = 0','｜ i を 1 から Akibiの要素数-1 まで繰り返す:','｜ ｜ もし Akibi[i] {{op}} saishou ならば:','｜ ｜ └ saishou = Akibi[i], tantou = i','｜ Akibi[tantou] = Akibi[tantou] + Nissu[k]'],frames:fs}}
function buildFlags(s){const a=arrayOf(s.flags).map(x=>x?1:0),target=+s.target,v={tantou:a,kosu:0},fs=[frame(0,{tantou:a},'担当の配列を用意'),frame(1,v,'kosu を 0 で初期化')];for(let i=0;i<a.length;i++){v.i=i;fs.push(frame(2,v,`tantou[${i}] を調べる`,undefined,{name:'tantou',index:i}));const ok=a[i]===target;fs.push(frame(3,v,`${a[i]} == ${target} は ${ok?'真':'偽'}`,undefined,{name:'tantou',index:i}));if(ok){v.kosu++;fs.push(frame(4,v,`kosu を 1 増やして ${v.kosu}`,undefined,{name:'tantou',index:i}))}}fs.push(frame(5,v,`kosu の値 ${v.kosu} を表示`,String(v.kosu)));return{code:['tantou = [{{flags}}]','kosu = 0','i を 0 から tantouの要素数-1 まで繰り返す:','｜ もし tantou[i] == {{target}} ならば:','｜ └ kosu = kosu + 1','表示する(kosu)'],frames:fs}}
let li=0,ei=0,step=0,timer=null,pred='',view='current';const active={},draft={};const $=q=>document.querySelector(q);const outputScreen=$('#outputScreen');
function item(){return lessons[li].items[ei]}function taskKey(){return `${li}-${ei}`}function defaults(){return Object.fromEntries(item().fields.map(f=>[f.key,f.value]))}
function ensure(){active[taskKey()]??=defaults();draft[taskKey()]??={...active[taskKey()]}}
function build(){ensure();return item().build(active[taskKey()])}
function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function field(k){return item().fields.find(f=>f.key===k)}
function editor(f){const val=draft[taskKey()][f.key];if(f.type==='select')return `<select class="edit" data-key="${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;return `<input aria-label="${esc(f.key)}" class="edit ${f.type==='array'?'array':''}" data-key="${f.key}" type="${f.type==='number'?'number':'text'}" value="${esc(val)}">`}
function codeLine(line){let out='',last=0,m,re=/\{\{(\w+)\}\}/g;while((m=re.exec(line))){out+=esc(line.slice(last,m.index))+editor(field(m[1]));last=m.index+m[0].length}return out+esc(line.slice(last))}
function changed(){ensure();return Object.keys(draft[taskKey()]).some(k=>String(draft[taskKey()][k])!==String(active[taskKey()][k]))}
function readEditors(){document.querySelectorAll('.edit').forEach(el=>draft[taskKey()][el.dataset.key]=el.value)}
function commitDraft(){readEditors();if(!changed())return false;active[taskKey()]={...draft[taskKey()]};step=0;stop();return true}
function stateAt(b){return step?b.frames[step-1]:{vars:{},log:'まだ実行していません。'}}
function norm(x){return String(x??'').replace(/[\s　]+/g,'').replace(/，/g,',').trim()}
function finalFeedback(b){if(step<b.frames.length||!pred)return;const actual=b.frames.at(-1)?.out??'';if(norm(pred)===norm(actual)){feedback.style.color='var(--green)';feedback.textContent='予想と一致しました！ どの行で値が決まったか確認しよう。'}else{feedback.style.color='#b1432d';feedback.textContent=`予想：${pred} ／ 実際：${actual}。違いが生まれた行まで戻って確認しよう。`}}
function nav(){tabs.innerHTML=lessons.map((l,i)=>`<button class="tab ${i===li?'active':''}" data-i="${i}">第${i+1}回　${l.title}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{li=+b.dataset.i;ei=0;step=0;pred='';stop();render()});exerciseList.innerHTML=lessons[li].items.map((x,i)=>`<button class="exercise ${i===ei?'active':''}" data-i="${i}"><strong>${i+1}. ${x.title}</strong><span>${x.concept}</span></button>`).join('');exerciseList.querySelectorAll('button').forEach(b=>b.onclick=()=>{ei=+b.dataset.i;step=0;pred='';stop();render()})}
function renderArrays(st){const entries=Object.entries(st.vars||{}).filter(([,v])=>Array.isArray(v));arrays.innerHTML=entries.map(([name,a])=>{const focus=st.focus?.name===name?st.focus.index:-1;return `<div class="array-card"><div class="array-name">${esc(name)}</div><div class="array-grid">${a.map((v,i)=>`<div class="cell ${i===focus?'focus':''}"><div class="idx">${i}</div><div class="val">${esc(v)}</div></div>`).join('')}</div>${focus>=0?`<div class="focus-note">${esc(name)}[${focus}] = ${esc(a[focus])}</div>`:''}</div>`}).join('')}
function valueText(vars){return Object.entries(vars||{}).filter(([,v])=>!Array.isArray(v)).map(([k,v])=>`${k}=${v}`).join('，')||'—'}
function renderTrace(b){traceBody.innerHTML=step?b.frames.slice(0,step).map((f,i)=>`<tr><td>${i+1}</td><td>${f.line+1}</td><td>${esc(f.log)}</td><td>${esc(valueText(f.vars))}${f.out!==undefined?`<br>出力=${esc(f.out)}`:''}</td></tr>`).join(''):'<tr><td colspan="4" style="color:#7b879e">実行すると、ここに履歴が残ります。</td></tr>'}
function render(){ensure();const l=lessons[li],x=item(),b=build(),st=stateAt(b),executed=new Set(b.frames.slice(0,step).map(f=>f.line)),nextLine=step<b.frames.length?b.frames[step].line:-1;round.textContent=`ROUND ${li+1} / 4`;lessonTitle.textContent=l.title;goal.textContent=l.goal;taskTitle.textContent=x.title;question.textContent=x.question;concept.textContent=x.concept;code.innerHTML=b.code.map((line,i)=>`<div class="line ${executed.has(i)?'done':''} ${i===nextLine?'now':''}" data-n="${i+1}">${codeLine(line)}</div>`).join('');code.querySelectorAll('.edit').forEach(el=>{el.oninput=e=>{draft[taskKey()][e.target.dataset.key]=e.target.value;dirty.classList.toggle('show',changed())};el.onchange=()=>dirty.classList.toggle('show',changed())});dirty.classList.toggle('show',changed());renderArrays(st);const scalar=Object.entries(st.vars||{}).filter(([,v])=>!Array.isArray(v));vars.innerHTML=scalar.length?scalar.map(([k,v])=>{const prev=step>1?b.frames[step-2]?.vars?.[k]:undefined;return `<tr><th>${esc(k)}</th><td><span class="${prev!==v?'changed':''}">${esc(v)}</span></td></tr>`}).join(''):'<tr><td style="color:#7b879e">実行すると値が現れます</td></tr>';log.textContent=st.log;outputScreen.textContent=st.out??(step?b.frames.slice(0,step).reverse().find(f=>f.out!==undefined)?.out:'')??'（まだ何も表示されていません）';hint.innerHTML=`<b>読むポイント：</b> ${esc(x.hint)}`;bar.style.width=`${b.frames.length?Math.round(step/b.frames.length*100):0}%`;counter.textContent=`${step} / ${b.frames.length}`;back.disabled=step===0;next.disabled=step>=b.frames.length;prediction.value=pred;renderTrace(b);currentView.hidden=view!=='current';traceView.hidden=view!=='trace';document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));nav();finalFeedback(b)}
function stop(){clearInterval(timer);timer=null;if($('#auto'))auto.textContent='自動実行'}
function prepareRun(){const wasChanged=commitDraft();if(wasChanged){feedback.style.color='#1769aa';feedback.textContent='変更した値を自動反映し、最初から実行します。'}return build()}
restore.onclick=()=>{active[taskKey()]=defaults();draft[taskKey()]={...active[taskKey()]};step=0;pred='';stop();feedback.textContent='元の設定に戻しました。';render()};reset.onclick=()=>{commitDraft();step=0;stop();feedback.textContent=pred?'予想は残っています。もう一度確かめよう。':'';render()};back.onclick=()=>{stop();if(commitDraft()){feedback.style.color='#1769aa';feedback.textContent='変更した値を自動反映し、最初に戻りました。';render();return}if(step>0)step--;render()};next.onclick=()=>{stop();const b=prepareRun();if(step<b.frames.length)step++;render()};auto.onclick=()=>{if(timer){stop();return}let b=prepareRun();render();auto.textContent='一時停止';timer=setInterval(()=>{b=build();if(step>=b.frames.length){stop();render();return}step++;render()},650)};
check.onclick=()=>{pred=prediction.value.trim();feedback.style.color=pred?'#155eef':'#9a5c00';feedback.textContent=pred?'予想を記録しました。実行して確かめよう。':'まず予想を書いてみよう。';finalFeedback(build())};prediction.oninput=e=>pred=e.target.value;document.querySelectorAll('.view-tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName)){if(e.key==='Enter'){e.target.blur();next.click()}return}if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')back.click();if(e.key.toLowerCase()==='r')reset.click()});render();
</script>
</body></html>
