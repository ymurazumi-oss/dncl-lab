<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報Ⅰ 共通テスト演習</title><style>
:root{--ink:#162033;--muted:#667085;--line:#d8dee8;--navy:#142744;--blue:#226ea8;--teal:#28796f;--paper:#f3f5f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--navy);color:#fff}.top strong{font-size:16px;letter-spacing:.04em}.top span{font-size:12px;color:#c9d4e5}.wrap{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:72px 0}.heading{margin-bottom:30px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.14em;color:#52617a}.heading h1{margin:8px 0 7px;font-size:clamp(28px,4vw,42px);letter-spacing:.02em}.heading p{margin:0;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{position:relative;min-height:300px;padding:28px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;box-shadow:0 8px 28px rgba(20,39,68,.06)}.section-no{font:700 11px/1 ui-monospace,monospace;color:var(--accent);letter-spacing:.12em}.card h2{margin:18px 0 5px;font-size:23px}.scope{color:var(--muted);font-size:13px}.contents{display:flex;gap:7px;flex-wrap:wrap;margin:24px 0}.contents span{padding:5px 8px;border:1px solid var(--line);border-radius:4px;color:#4b566b;font-size:12px}.access{display:grid;grid-template-columns:1fr auto;gap:8px}.access input{min-width:0;height:43px;padding:0 12px;border:1px solid #aeb8c7;border-radius:6px;background:#fff;font-size:16px;letter-spacing:.08em}.access input:focus{outline:3px solid color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent)}button{height:43px;padding:0 18px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:750;cursor:pointer}.message{min-height:21px;margin-top:7px;color:#a0362a;font-size:12px}.resume{display:none;width:100%;margin-top:4px;background:#eef2f6;color:#263750}.card.unlocked .resume{display:block}.card.unlocked .access{display:none}.card.shake{animation:shake .28s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.foot{margin-top:24px;color:#7a8495;font-size:11px}@media(max-width:720px){.top{padding:0 16px}.top span{display:none}.wrap{padding:42px 0}.cards{grid-template-columns:1fr}.card{min-height:auto;padding:23px}}
</style></head><body><header class="top"><strong>情報Ⅰ 共通テスト演習</strong><span>Information I / Practice</span></header><main class="wrap"><section class="heading"><div class="eyebrow">COURSE INDEX</div><h1>教材一覧</h1><p>受講分野のアクセスコードを入力してください。</p></section><section class="cards">
<article class="card" id="programCard" style="--accent:var(--blue)"><div class="section-no">01 / PROGRAMMING</div><h2>プログラミング</h2><div class="scope">DNCL・アルゴリズム・配列・探索</div><div class="contents"><span>演習問題</span><span>DNCL実行環境</span><span>解答・解説</span></div><div class="access"><input id="programInput" autocomplete="off" autocapitalize="characters" placeholder="ACCESS CODE" aria-label="プログラミングのアクセスコード"><button data-course="program">開く</button></div><div class="message" aria-live="polite"></div><button class="resume" data-href="programming.html">前回のページ</button></article>
<article class="card" id="infoCard" style="--accent:var(--teal)"><div class="section-no">02 / GENERAL TOPICS</div><h2>情報社会・データ活用</h2><div class="scope">情報デザイン・ネットワーク・データ分析</div><div class="contents"><span>重要用語</span><span>演習問題</span><span>解答・解説</span></div><div class="access"><input id="infoInput" autocomplete="off" autocapitalize="characters" placeholder="ACCESS CODE" aria-label="情報社会・データ活用のアクセスコード"><button data-course="info">開く</button></div><div class="message" aria-live="polite"></div><button class="resume" data-href="info.html">前回のページ</button></article>
</section><div class="foot">横浜女学院中学校高等学校｜情報Ⅰ 夏期講習</div></main><script>
const courses={program:{word:'DNCL',href:'programming.html',card:'programCard',input:'programInput'},info:{word:'INFO',href:'info.html',card:'infoCard',input:'infoInput'}};function enter(key){const c=courses[key],card=document.getElementById(c.card),input=document.getElementById(c.input),msg=card.querySelector('.message');if(input.value.trim().toUpperCase()===c.word){localStorage.setItem('info1_access_'+key,'1');location.href=c.href}else{msg.textContent='アクセスコードを確認してください。';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');input.select()}}document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>enter(b.dataset.course));document.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')enter(i.id.startsWith('program')?'program':'info')}));document.querySelectorAll('.resume').forEach(b=>b.onclick=()=>location.href=b.dataset.href);for(const [key,c] of Object.entries(courses))if(localStorage.getItem('info1_access_'+key)==='1')document.getElementById(c.card).classList.add('unlocked');
</script></body></html>
