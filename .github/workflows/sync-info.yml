name: Sync INFO glossary
on:
  push:
    paths: [.github/workflows/sync-info.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch INFO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("info.html")
          s=p.read_text(encoding="utf-8")
          pairs=[
          ('<option value="ia">解答・解説｜第1〜4回 生徒用</option>','<option value="ia">解答・解説｜第1〜4回 生徒用</option><option value="ig">用語リファレンス｜検索・分野別</option>'),
          ('</button></nav><div class="tip">','</button><button class="item" data-id="ig"><div class="row"><strong>用語リファレンス</strong><i class="tag">検索</i></div><span>定義・設問上の着眼点</span></button></nav><div class="tip">'),
          (';const storageKey="info1_knowledge_last"',';resources.ig={label:"用語リファレンス",sub:"定義・設問上の着眼点",type:"用語集",url:"glossary.html"};const storageKey="info1_knowledge_last"'),
          ("objectUrl=URL.createObjectURL(new Blob([decode(r.data)],{type:'text/html;charset=utf-8'}));viewer.src=objectUrl","r.url?(viewer.src=r.url):(objectUrl=URL.createObjectURL(new Blob([decode(r.data)],{type:'text/html;charset=utf-8'})),viewer.src=objectUrl)"),
          ("document.getElementById('openBtn').addEventListener('click',()=>{const blob=new Blob([decode(resources[current].data)],{type:'text/html;charset=utf-8'});window.open(URL.createObjectURL(blob),'_blank')})","document.getElementById('openBtn').addEventListener('click',()=>{const r=resources[current];if(r.url){window.open(r.url,'_blank');return}const blob=new Blob([decode(r.data)],{type:'text/html;charset=utf-8'});window.open(URL.createObjectURL(blob),'_blank')})")
          ]
          for a,b in pairs:
              assert a in s,a
              s=s.replace(a,b,1)
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sync-info.yml
          git add info.html
          git commit -m "Add searchable INFO glossary"
          git push
