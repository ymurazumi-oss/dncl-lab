name: Finalize navigation fix
on:
  push:
    paths:
      - .github/workflows/finalize-navigation.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move navigation initialization
        shell: python
        run: |
          from pathlib import Path

          marker = "const shell=document.getElementById('shell'),navToggle=document.getElementById('navToggle');"
          event_hook = "\n  document.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>show(b.dataset.id)));"

          for filename in ("programming.html", "info.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")

              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"{filename}: navigation block not found")
              end_token = "navToggle.addEventListener('click',()=>setNav(!shell.classList.contains('nav-collapsed')));"
              end = text.find(end_token, start)
              if end < 0:
                  raise SystemExit(f"{filename}: navigation block end not found")
              end += len(end_token)
              nav = text[start:end]
              text = text[:start] + text[end:]

              if event_hook not in text:
                  raise SystemExit(f"{filename}: event hook not found")
              text = text.replace(event_hook, "\n  " + nav + event_hook, 1)

              show_segment = text[text.find("function show"):text.find("\n", text.find("function show"))]
              if marker in show_segment:
                  raise SystemExit(f"{filename}: navigation still inside show()")
              if text.count(marker) != 1:
                  raise SystemExit(f"{filename}: navigation block count is {text.count(marker)}")

              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/finalize-navigation.yml").unlink()
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programming.html info.html .github/workflows/finalize-navigation.yml
          git commit -m "Fix navigation initialization placement"
          git push
