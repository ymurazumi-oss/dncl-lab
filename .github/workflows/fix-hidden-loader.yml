name: Fix hidden loader style
on:
  push:
    paths:
      - '.github/workflows/fix-hidden-loader.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hidden style
        shell: python
        run: |
          from pathlib import Path

          marker = "button,input{font:inherit}"
          replacement = "[hidden]{display:none!important}" + marker
          for filename in ("programming.html", "info.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "[hidden]{display:none!important}" in text:
                  continue
              if marker not in text:
                  raise SystemExit(f"{filename}: CSS marker not found")
              path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          Path(".github/workflows/fix-hidden-loader.yml").unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programming.html info.html .github/workflows/fix-hidden-loader.yml
          git commit -m "Fix loader hidden state"
          git push
