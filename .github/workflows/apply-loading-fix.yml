name: Apply loading fix
on:
  push:
    paths:
      - '.github/workflows/apply-loading-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch embedded lesson loading
        shell: python
        run: |
          from pathlib import Path

          prog = Path("programming.html")
          text = prog.read_text(encoding="utf-8")
          old = "let current='';"
          new = "let current='',objectUrl='';"
          if old not in text:
              raise SystemExit("programming variable marker not found")
          text = text.replace(old, new, 1)
          old = "loader.hidden=false;viewer.hidden=true;viewer.onload=()=>{loader.hidden=true;viewer.hidden=false};if(r.src){viewer.removeAttribute('srcdoc');viewer.src=r.src}else{viewer.removeAttribute('src');viewer.srcdoc=decode(r.data)}localStorage.setItem(storageKey,id)"
          new = "loader.hidden=false;viewer.hidden=true;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=''}viewer.onload=()=>{loader.hidden=true;viewer.hidden=false};if(r.src){viewer.src=r.src}else{objectUrl=URL.createObjectURL(new Blob([decode(r.data)],{type:'text/html;charset=utf-8'}));viewer.src=objectUrl}setTimeout(()=>{loader.hidden=true;viewer.hidden=false},1200);localStorage.setItem(storageKey,id)"
          if old not in text:
              raise SystemExit("programming loader marker not found")
          prog.write_text(text.replace(old, new, 1), encoding="utf-8")

          info = Path("info.html")
          text = info.read_text(encoding="utf-8")
          if "let current='';" not in text:
              raise SystemExit("info variable marker not found")
          text = text.replace("let current='';", "let current='',objectUrl='';", 1)
          old = "loader.hidden=false;viewer.hidden=true;viewer.onload=()=>{loader.hidden=true;viewer.hidden=false};viewer.srcdoc=decode(r.data);localStorage.setItem(storageKey,id)"
          new = "loader.hidden=false;viewer.hidden=true;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=''}viewer.onload=()=>{loader.hidden=true;viewer.hidden=false};objectUrl=URL.createObjectURL(new Blob([decode(r.data)],{type:'text/html;charset=utf-8'}));viewer.src=objectUrl;setTimeout(()=>{loader.hidden=true;viewer.hidden=false},1200);localStorage.setItem(storageKey,id)"
          if old not in text:
              raise SystemExit("info loader marker not found")
          info.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/apply-loading-fix.yml").unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programming.html info.html .github/workflows/apply-loading-fix.yml
          git commit -m "Fix embedded lesson loading"
          git push
